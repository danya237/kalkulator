<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budsjettkalkulator</title>


    <link rel="stylesheet" href="css/style.css">
    <script type="modul" src="js/script.js"></script>
</head>
<body>
<div id ="app">
    <table class ="budget-tracker">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th></th>
                </tr>
            </thead>
            <tbody class="enteries">        
                    <tr>
                        <td>
                            <input class="input input-date" type="date">
                        </td>
                        <td>
                            <input class="input input-date" type="text" placeholder="Add a description (wages, bills, etc.)">)">
                        </td>
                        <td>
                            <select class="input input-type">
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </td>
                        <td>
                            <input type="number" class="input input-amount" placeholder="Amount">
                        </td>
                        <td>
                            <button type="button" class="delete-entry">&#10005;</button>
                        </td>
                    </tr>
    </table>
</div>
</body>
</html>
